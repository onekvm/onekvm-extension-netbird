name: Check NetBird release

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: netbird-version-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      update: ${{ steps.release.outputs.update }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check the upstream release through GitHub API
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/netbirdio/netbird/releases/latest --jq '.tag_name' | sed 's/^v//')"
          content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/oe-recipes/recipes-onekvm/netbird/onekvm-extension-netbird_1.0.0.bb?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          current="$(printf '%s\n' "$content" | sed -n 's/^NETBIRD_VERSION = "\([^"]*\)"/\1/p')"
          test -n "$current"
          echo "NetBird: $current -> $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$latest" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the extension
        uses: actions/checkout@v4

      - name: Update the pinned client release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ needs.check.outputs.version }}
        run: python3 scripts/check-netbird-version.py --update

      - name: Open a pull request for a new release
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/netbird-version
          delete-branch: true
          commit-message: "build(netbird): update client to ${{ needs.check.outputs.version }}"
          title: "build(netbird): update client to ${{ needs.check.outputs.version }}"
          body: |
            This pull request was opened by the daily NetBird release check.

            It updates the pinned NetBird client version and upstream source revision. The OneKVM extension package version remains unchanged.

            Please regenerate and review the checked Go module and license metadata before merging.
